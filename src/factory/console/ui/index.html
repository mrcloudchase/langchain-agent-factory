<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Factory</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#065f46;--okbg:#d1fae5;--bad:#991b1b;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7;--blue:#1e40af;--bluebg:#dbeafe;--purple:#5b21b6;--purplebg:#ede9fe;--ink2:#374151}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{display:flex;align-items:center;gap:18px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .brand{font-weight:700;font-size:16px}header nav a{color:var(--ink2);text-decoration:none;margin-right:14px;padding:6px 2px;border-bottom:2px solid transparent}header nav a.active{border-color:#111827;color:#111827}
header .grow{flex:1}.sub{color:var(--muted);font-size:12.5px}
main{padding:20px 24px;max-width:1440px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}h3{font-size:14px;margin:12px 0 6px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;background:var(--line);margin:1px 3px 1px 0;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.warn{background:var(--warnbg);color:var(--warn)}.blue{background:var(--bluebg);color:var(--blue)}.purple{background:var(--purplebg);color:var(--purple)}
.small{color:var(--muted);font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;margin:2px 4px 2px 0}
button:hover{background:#f3f4f6}button.primary{background:#111827;color:#fff;border-color:#111827}button.primary:hover{background:#000}
button.approve{background:var(--okbg);color:var(--ok);border-color:#a7f3d0}button.reject{background:var(--badbg);color:var(--bad);border-color:#fecaca}button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;width:100%;background:#fff}
textarea{min-height:64px}label.f{display:block;margin:8px 0 4px;font-size:12px;color:var(--ink2);font-weight:600}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.tcard{border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:#fff}.tcard:hover{border-color:#9ca3af}.tcard.sel{border-color:#111827;box-shadow:0 0 0 2px #11182722}
.tcard .t{font-weight:600;margin-bottom:4px}
.pipeline{display:flex;align-items:center;gap:0;margin:10px 0 6px;flex-wrap:wrap}
.stage{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:600;font-size:13px}
.stage.done{background:var(--okbg);color:var(--ok);border-color:#a7f3d0}.stage.cur{background:#111827;color:#fff;border-color:#111827}
.gates{padding:0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:140px}.gates .g{white-space:nowrap}
.arrow{color:#9ca3af;padding:0 4px}
.pending{border-left:4px solid #f59e0b;padding:10px 12px;margin:8px 0;background:#fffbeb;border-radius:6px}
.empty{color:var(--muted);padding:8px 0}
#log{max-height:300px;overflow:auto;background:#0b1020;color:#d1d5db;border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;margin-top:8px}
.chat{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafafa}
.msg{margin:6px 0;padding:8px 10px;border-radius:8px;max-width:92%;white-space:pre-wrap;font-size:13px}.msg.user{background:#111827;color:#fff;margin-left:auto}.msg.ai{background:#fff;border:1px solid var(--line)}.msg.tool{background:#eef2ff;color:#3730a3;font-family:ui-monospace,Menlo,monospace;font-size:12px}.msg.pause{background:var(--warnbg);color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 12px}.tabs a{padding:8px 12px;text-decoration:none;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer}.tabs a.active{border-color:#111827;color:#111827;font-weight:600}
a{color:var(--blue)}details summary{cursor:pointer;color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.stepbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:#fff}.stepbox .k{font-weight:600}
.toast{position:fixed;bottom:16px;right:16px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <span class="brand">Agent Factory</span>
  <nav><a href="#/">Catalog</a><a href="#/create">Create</a><a href="#/approvals">Approvals <span id="navPending" class="badge warn" style="display:none"></span></a><a href="#/admin">Admin</a></nav>
  <span class="grow"></span>
  <span class="sub" id="mode"></span>
  <span class="sub">Signed in as</span>
  <select id="userSel" style="width:260px" onchange="setUser(this.value)"></select>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<div class="toast" id="toast"></div>

<script>
// ---------- infrastructure ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = (t, k='') => `<span class="badge ${k}">${esc(t)}</span>`;
const fmt = s => s ? String(s).slice(0,16).replace('T',' ') : '';
let ME = null, USERS = [], MODE = null, REG = null, TIMER = null;
function user(){ try { return localStorage.getItem('factory_user') || ''; } catch(e){ return ''; } }
function setUser(u){ try{ localStorage.setItem('factory_user', u); }catch(e){} boot(); }
async function api(path, opts={}){
  const r = await fetch('/console/api' + path, {...opts, headers: {'content-type':'application/json', 'X-Factory-User': user(), ...(opts.headers||{})}});
  if(!r.ok){ let t = await r.text(); try{ t = JSON.parse(t).detail || t; }catch(e){} throw new Error(`${r.status}: ${t}`); }
  return r.json();
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2600); }
function role(){ return ME ? ME.role : null; }
function canBuild(team){ return ME && (ME.role==='platform' || ((ME.role==='builder'||ME.role==='approver') && ME.team===team)); }

async function boot(){
  const d = await api('/me'); ME = d.user; USERS = d.users; MODE = d.mode;
  $('#userSel').innerHTML = '<option value="">— nobody —</option>' + USERS.map(u => `<option value="${esc(u.id)}" ${u.id===user()?'selected':''}>${esc(u.name)} · ${esc(u.role)}${u.team?' · '+esc(u.team):''}</option>`).join('');
  const dot = `<span class="dot" style="background:${MODE.offline?'#f59e0b':'#10b981'}"></span>`;
  $('#mode').innerHTML = `${dot}${MODE.offline ? 'offline (scripted replay)' : 'live · ' + esc(MODE.model)} · ${MODE.langsmith ? 'LangSmith on' : 'LangSmith off'}`;
  route();
}
window.addEventListener('hashchange', route);
async function route(){
  if(TIMER){ clearInterval(TIMER); TIMER = null; }
  const h = location.hash || '#/';
  document.querySelectorAll('header nav a').forEach(a => a.classList.toggle('active', h === a.getAttribute('href') || (a.getAttribute('href')!=='#/' && h.startsWith(a.getAttribute('href')))));
  try{
    if(h === '#/' ) await viewCatalog();
    else if(h === '#/create') await viewCreate();
    else if(h === '#/approvals') await viewApprovals();
    else if(h === '#/admin') await viewAdmin();
    else if(h.startsWith('#/agents/')) await viewAgent(decodeURIComponent(h.slice(9).split('/')[0]), h.split('/')[4] || 'overview');
    else $('#view').innerHTML = '<div class="empty">Not found.</div>';
  }catch(e){ $('#view').innerHTML = `<div class="card">${badge('error','bad')} ${esc(e.message)}</div>`; }
  refreshNavPending();
}
async function refreshNavPending(){ try{ const a = await api('/approvals'); const n = a.actions.length + a.promotions.filter(p=>p.can_approve).length; const el=$('#navPending'); el.style.display = n?'':'none'; el.textContent=n; }catch(e){} }

// ---------- pipeline widget ----------
function pipelineHTML(p){
  const idx = p.stages.indexOf(p.current);
  const pend = p.pending[0];
  let html = '<div class="pipeline">';
  p.stages.forEach((s, i) => {
    const cls = i < idx ? 'done' : i === idx ? 'cur' : '';
    html += `<span class="stage ${cls}">${esc(s)}</span>`;
    if(i < p.stages.length - 1){
      const t = p.transitions.find(t => t.to === p.stages[i+1]) || {gates:[]};
      const gates = t.gates.map(g => {
        let state = '';
        if(i < idx) state = '✓';
        else if(pend && pend.to === p.stages[i+1]){
          if(g === 'policy' || g === 'evals') state = '✓';
          else if(g === 'approval' || g === 'platform_approval') state = pend.approvals.some(a => a.gate === g) ? '✓' : '⏳';
        }
        return `<span class="g">${state ? state + ' ' : '○ '}${esc(g === 'platform_approval' ? 'platform approval' : g === 'approval' ? 'approver: ' + (t.approver_role||'approver') : g)}</span>`;
      }).join('');
      html += `<span class="gates">${gates}${t.budget && Object.keys(t.budget).length ? `<span class="g">○ budget ${esc(JSON.stringify(t.budget))}</span>` : ''}</span><span class="arrow">→</span>`;
    }
  });
  return html + '</div>';
}

// ---------- catalog ----------
async function viewCatalog(){
  const cat = await api('/catalog');
  const rows = cat.agents.map(a => {
    const ev = a.eval;
    const evcell = ev ? badge(ev.passed?'pass':'fail', ev.passed?'ok':'bad') + `<div class="small">${Object.entries(ev.scores).map(([k,v])=>`${k} ${v.toFixed(2)}`).join(', ')}${ev.experiment_url?` · <a href="${esc(ev.experiment_url)}" target="_blank">experiment</a>`:''}</div>` : badge('not run');
    const pend = a.pipeline.pending.length ? badge('promotion pending','warn') : '';
    return `<tr>
      <td><a href="#/agents/${esc(a.name)}"><b>${esc(a.display_name)}</b></a><div class="small mono">${esc(a.name)} · ${esc(a.template)}</div><div class="small">${esc(a.purpose).slice(0,110)}</div></td>
      <td>${badge(a.archetype, a.archetype==='workflow'?'blue':'purple')}</td>
      <td>${esc(a.team)}<div class="small">${esc(a.owner)}</div></td>
      <td>${badge(a.stage, a.stage==='production'?'ok':a.stage==='staging'?'blue':'')}${pend}<div class="small">${esc(a.process)}</div></td>
      <td>${a.surfaces.map(s=>badge(s.kind,'blue')).join('')}</td>
      <td>${a.policy.ok ? badge('ok','ok') : badge('violations','bad')}${a.policy.warnings.length?`<div class="small">${a.policy.warnings.length} warning(s)</div>`:''}</td>
      <td>${evcell}</td></tr>`; }).join('');
  const byStage = s => cat.agents.filter(a => a.stage === s).length;
  $('#view').innerHTML = `
    <div class="row" style="margin-bottom:12px"><div class="grow"><h1>Catalog</h1><div class="sub">${cat.agents.length} agents · ${byStage('production')} in production · ${byStage('staging')} in staging · ${Object.keys(cat.tools).length} published tools · ${Object.keys(cat.teams).length} teams</div></div>
      <a href="#/create"><button class="primary">Create an agent</button></a></div>
    <div class="card"><table><thead><tr><th>Agent</th><th>Type</th><th>Team / owner</th><th>Stage · process</th><th>Surfaces</th><th>Policy</th><th>Latest gate</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7" class="empty">No agents yet. Create one from a template.</td></tr>'}</tbody></table></div>`;
}

// ---------- create wizard ----------
let W = {step:1, template:null, tpl:null, form:{}, examples:[{},{},{}]};
async function viewCreate(){
  REG = REG || await api('/registry');
  if(!ME){ $('#view').innerHTML = '<div class="card">Sign in as a builder, approver, or platform user to create an agent.</div>'; return; }
  renderWizard();
}
function renderWizard(){
  const steps = ['Choose a template','Configure','Examples','Review & create'];
  const head = `<h1>Create an agent</h1><div class="sub" style="margin-bottom:12px">${steps.map((s,i)=>`<span class="badge ${W.step===i+1?'purple':''}">${i+1}. ${s}</span>`).join(' ')}</div>`;
  let body = '';
  if(W.step === 1){
    const group = a => REG.templates.filter(t => t.archetype === a).map(t => `
      <div class="tcard ${W.template===t.key?'sel':''}" onclick="pickTemplate('${t.key}')">
        <div class="t">${esc(t.title)} ${badge(t.archetype, t.archetype==='workflow'?'blue':'purple')}</div>
        <div class="small">${esc(t.summary)}</div>
        <div style="margin-top:8px">${t.pauses_for_human.length ? badge('pauses for a human: ' + t.pauses_for_human.join(', '), 'warn') : badge('no side effects','ok')} ${badge('process: ' + t.process)} ${badge('team: ' + t.team_default)}</div>
        ${t.steps.length ? `<div class="small" style="margin-top:6px">steps: ${t.steps.map(s=>esc(s.title)).join(' → ')}</div>` : ''}
      </div>`).join('');
    body = `<div class="card"><h2>Workflows <span class="small">fixed steps; the model works inside each step</span></h2><div class="grid3">${group('workflow')}</div></div>
            <div class="card"><h2>Agents <span class="small">the model decides the steps; tools and approvals bound it</span></h2><div class="grid3">${group('agent')}</div></div>
            <div class="row"><span class="grow"></span><button class="primary" ${W.template?'':'disabled'} onclick="W.step=2;loadTpl()">Next</button></div>`;
  } else if(W.step === 2){
    const t = W.tpl; const f = W.form;
    const team = f.team || (canBuild(t.team_default) ? t.team_default : ME.team);
    const teams = REG.teams.filter(x => (!t.allowed_teams.length || t.allowed_teams.includes(x.name)) && canBuild(x.name));
    const params = t.parameters.map(p => `<label class="f">${esc(p.label)}${p.required?' *':''}</label>${p.type==='text' ? `<textarea oninput="W.form.parameters['${p.key}']=this.value">${esc(f.parameters[p.key] ?? p.default ?? '')}</textarea>` : `<input type="${p.type==='number'?'number':'text'}" value="${esc(f.parameters[p.key] ?? p.default ?? '')}" oninput="W.form.parameters['${p.key}']=this.value">`}${p.help?`<div class="small">${esc(p.help)}</div>`:''}`).join('');
    const chosen = new Set(f.tools || t.tools.default), approve = new Set(f.approve || t.oversight.required_approve);
    const tools = REG.tools.filter(x => t.tools.allowed.includes(x.name) || chosen.has(x.name)).map(x => {
      const allowed = (!x.teams.length || x.teams.includes(team));
      return `<label style="display:block;opacity:${allowed?1:.5};margin:3px 0"><input type="checkbox" ${chosen.has(x.name)?'checked':''} ${allowed?'':'disabled'} onchange="toggleTool('${x.name}',this.checked)"> <span class="mono">${esc(x.name)}</span> ${x.sensitive?badge('sensitive','warn'):''} ${x.scope==='user'?badge('acts as user','blue'):''} <span class="small">${esc(x.description)}</span>${!allowed?`<span class="small"> · not allowed for ${esc(team)}</span>`:''}
        ${x.sensitive?`<label style="margin-left:10px"><input type="checkbox" ${approve.has(x.name)?'checked':''} ${t.oversight.required_approve.includes(x.name)?'disabled':''} onchange="toggleApprove('${x.name}',this.checked)"> pauses for approval${t.oversight.required_approve.includes(x.name)?' (required by template)':''}</label>`:''}</label>`; }).join('');
    const surf = new Set(f.surfaces || t.surfaces.default);
    const surfaces = t.surfaces.allowed.map(s => `<label style="margin-right:12px"><input type="checkbox" ${surf.has(s)?'checked':''} onchange="toggleSurface('${s}',this.checked)"> ${s}</label>`).join('');
    body = `<div class="card"><div class="grid2"><div>
        <h2>${esc(t.title)} ${badge(t.archetype, t.archetype==='workflow'?'blue':'purple')}</h2>
        <label class="f">Name (snake_case)</label><input type="text" value="${esc(f.name||'')}" oninput="W.form.name=this.value" placeholder="e.g. claims_intake">
        <label class="f">Display name</label><input type="text" value="${esc(f.display_name||'')}" oninput="W.form.display_name=this.value" placeholder="Claims Intake">
        <label class="f">Team</label><select onchange="W.form.team=this.value;renderWizard()">${teams.map(x=>`<option value="${x.name}" ${x.name===team?'selected':''}>${esc(x.display_name)}</option>`).join('')}</select>
        <label class="f">Owner (accountable human)</label><input type="text" value="${esc(f.owner||ME.id)}" oninput="W.form.owner=this.value">
        <label class="f">Purpose</label><textarea oninput="W.form.purpose=this.value">${esc(f.purpose ?? t.summary)}</textarea>
        <label class="f">Model tier</label><select onchange="W.form.model_tier=this.value">${REG.tiers.map(x=>`<option value="${x.name}" ${(f.model_tier||t.model_tier)===x.name?'selected':''}>${esc(x.name)} — ${esc(x.model)}</option>`).join('')}</select>
        <h3>Parameters <span class="small">the plain-language part the template asks for</span></h3>${params || '<div class="small">This template has no parameters.</div>'}
      </div><div>
        <h3>Tools <span class="small">from the published catalog, filtered to what ${esc(team)} may use</span></h3>${tools || '<div class="small">This template uses no tools.</div>'}
        <h3>Surfaces <span class="small">where it will live; allowed by the template</span></h3>${surfaces}
        ${t.steps.length ? `<h3>Steps</h3>${t.steps.map(s=>`<div class="stepbox"><span class="k">${esc(s.title)}</span> <span class="small mono">${esc(s.key)}</span>${s.tools.length?' '+s.tools.map(x=>badge(x)).join(''):''}</div>`).join('')}` : ''}
      </div></div>
      <div class="row" style="margin-top:12px"><button onclick="W.step=1;renderWizard()">Back</button><span class="grow"></span><button class="primary" onclick="W.step=3;renderWizard()">Next</button></div></div>`;
  } else if(W.step === 3){
    const ex = W.examples.map((e,i)=>`<div class="stepbox"><label class="f">Example ${i+1}: a realistic request</label><input type="text" value="${esc(e.question||'')}" oninput="W.examples[${i}].question=this.value" placeholder="${esc(W.tpl.example_questions[i] || 'e.g. ' + (W.tpl.example_questions[0]||''))}">
      <label class="f">Phrases a correct answer must contain (comma-separated)</label><input type="text" value="${esc(e.must||'')}" oninput="W.examples[${i}].must=this.value" placeholder="e.g. approve, 1,850"></div>`).join('');
    body = `<div class="card"><h2>Examples <span class="small">these become the eval set; the template's ${W.tpl.examples} starter examples are included automatically</span></h2>
      <div class="small" style="margin-bottom:8px">Starter examples from the template: ${W.tpl.example_questions.map(q=>`<span class="badge">${esc(q).slice(0,70)}</span>`).join(' ')}</div>${ex}
      <div class="row" style="margin-top:12px"><button onclick="W.step=2;renderWizard()">Back</button><span class="grow"></span><button class="primary" onclick="W.step=4;renderWizard();reviewDraft()">Review</button></div></div>`;
  } else {
    body = `<div class="card"><h2>Review</h2><div id="reviewBox"><div class="empty">Checking policy…</div></div>
      <div class="row" style="margin-top:12px"><button onclick="W.step=3;renderWizard()">Back</button><span class="grow"></span>
        <button id="btnCreate" class="primary" disabled onclick="createAgent(false)">Create</button><button id="btnCreateGate" class="primary" disabled onclick="createAgent(true)">Create + run gate</button></div>
      <div id="createResult"></div></div>`;
  }
  $('#view').innerHTML = head + body;
}
function pickTemplate(k){ W.template = k; W.form = {parameters:{}}; renderWizard(); }
async function loadTpl(){ W.tpl = await api('/templates/' + W.template); W.form.parameters = W.form.parameters || {}; W.examples = [{},{},{}]; renderWizard(); }
function toggleTool(n, on){ const s = new Set(W.form.tools || W.tpl.tools.default); on ? s.add(n) : s.delete(n); W.form.tools = [...s]; }
function toggleApprove(n, on){ const s = new Set(W.form.approve || W.tpl.oversight.required_approve); on ? s.add(n) : s.delete(n); W.form.approve = [...s]; }
function toggleSurface(n, on){ const s = new Set(W.form.surfaces || W.tpl.surfaces.default); on ? s.add(n) : s.delete(n); W.form.surfaces = [...s]; }
function draftBody(){
  const f = W.form, t = W.tpl;
  return { name: (f.name||'').trim(), display_name: (f.display_name||'').trim() || null, template: t.key, team: f.team || (canBuild(t.team_default) ? t.team_default : ME.team),
    owner: (f.owner||ME.id).trim(), purpose: (f.purpose ?? t.summary).trim(), parameters: f.parameters || {}, tools: f.tools || null, approve: f.approve || null,
    surfaces: f.surfaces ? f.surfaces.map(k => ({kind: k})) : null, model_tier: f.model_tier || null,
    examples: W.examples.filter(e => e.question).map(e => ({question: e.question, must_contain: (e.must||'').split(',').map(s=>s.trim()).filter(Boolean)})) };
}

async function removeAgent(name){ if(!confirm(`Delete ${name}?`)) return; await api('/agents/'+name, {method:'DELETE'}); location.hash = '#/'; }
function renderChat(){
  const el = $('#chat'); if(!el) return;
  if(!CHAT.msgs.length) return;
  el.innerHTML = CHAT.msgs.map(m => `<div class="msg ${m.type}">${m.type==='tool'?esc(m.name)+': ':''}${esc(m.content)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
async function sendChat(name){
  const q = $('#q').value.trim(); if(!q) return; $('#q').value = '';
  CHAT.msgs.push({type:'user', content:q}); renderChat();
  try{
    const r = await api(`/agents/${name}/run`, {method:'POST', body: JSON.stringify({question:q})});
    CHAT.thread = r.thread_id; CHAT.msgs.push({type:'tool', name:'run', content:'started… tool calls and the answer appear as the server works'}); renderChat();
    pollThread(name);
  }catch(e){ CHAT.msgs.push({type:'pause', content:'error: '+e.message}); renderChat(); }
}
async function pollThread(name){
  for(let i=0;i<40;i++){
    await new Promise(r=>setTimeout(r,1500));
    const d = await api('/threads/' + CHAT.thread);
    const msgs = d.messages.filter(m => m.type !== 'human' || !m.content.startsWith('[step:')).filter(m=>!(m.type==='human'));
    const rendered = msgs.flatMap(m => m.type==='tool' ? [{type:'tool', name:m.name, content:m.content.slice(0,300)}] : (m.type==='ai' && m.content ? [{type:'ai', content:m.content}] : []));
    CHAT.msgs = [{type:'user', content: CHAT.msgs[0].content}, ...rendered];
    if(d.pending.length){
      const reqs = d.pending[0].action_requests;
      CHAT.msgs.push({type:'pause', content:`Paused for approval: ${reqs.map(r=>r.name+'('+JSON.stringify(r.args)+')').join(', ')}`});
      renderChat();
      $('#chat').insertAdjacentHTML('beforeend', `<div class="row" style="margin-top:6px"><button class="approve" onclick="decideChat('${name}','approve')">Approve</button><button class="reject" onclick="decideChat('${name}','reject')">Reject</button></div>`);
      return;
    }
    renderChat();
    if(rendered.length && rendered[rendered.length-1].type === 'ai' && (d.outputs ? true : true)){
      // done when the last message is an AI message and no pending; keep polling briefly in case more comes
      if(i > 1) return;
    }
  }
}
async function decideChat(name, decision){
  try{ await api('/approvals/' + CHAT.thread, {method:'POST', body: JSON.stringify({decision})}); CHAT.msgs.push({type:'tool', name:'operator', content: decision + 'd'}); renderChat(); pollThread(name); }
  catch(e){ toast(e.message); }
}

      <details><summary>per-example detail</summary>${r.details.map(d=>`<div class="small">${Object.values(d.scores).some(v=>v<1)?'✗':'✓'} <b>${esc(d.example)}</b> ${esc(d.question)} · tools ${esc(d.tool_calls.join(', '))} · pauses ${esc(d.interrupts.join(', ')||'none')}</div>`).join('')}</details></div>`;

async function acceptCase(name, id){ const v = $('#mc-'+id).value; if(!v.trim()){ toast('write what a correct answer must contain first'); return; } await api(`/agents/${name}/cases/accept`, {method:'POST', body: JSON.stringify({case_id:id, must_contain: v.split(',').map(s=>s.trim()).filter(Boolean)})}); toast('accepted into the dataset'); route(); }

async function viewAdmin(){
  REG = await api('/registry');
  const tpl = REG.templates.map(t=>`<tr><td><b>${esc(t.title)}</b><div class="small mono">${esc(t.key)}</div></td><td>${badge(t.archetype,t.archetype==='workflow'?'blue':'purple')}</td><td>${esc(t.team_default)}${t.allowed_teams.length?`<div class="small">allowed: ${esc(t.allowed_teams.join(', '))}</div>`:''}</td><td>${esc(t.process)}</td><td>${t.tools.default.map(x=>badge(x)).join('')}</td><td>${t.pauses_for_human.map(x=>badge(x,'warn')).join('')||'-'}</td><td>${t.parameters.length}</td></tr>`).join('');
  const tools = REG.tools.map(x=>`<tr><td class="mono">${esc(x.name)}</td><td>${badge(x.risk, x.risk==='high'?'bad':x.risk==='medium'?'warn':'ok')}</td><td>${esc(x.scope)}</td><td>${x.sensitive?badge('pauses','warn'):''}</td><td>${x.teams.length?x.teams.map(t=>badge(t)).join(''):badge('all teams')}</td><td>${esc(x.owner)}</td><td class="small">${esc(x.description)}</td></tr>`).join('');
  const procs = Object.values(REG.processes).map(p=>`<div class="stepbox"><span class="k">${esc(p.name)}</span> <span class="small">${esc(p.description)}</span>${pipelineHTML({stages:p.stages, current:'dev', transitions:p.transitions, pending:[]})}</div>`).join('');
  const users = REG.users.map(u=>`<tr><td>${esc(u.name)}</td><td class="mono small">${esc(u.id)}</td><td>${badge(u.role, u.role==='platform'?'purple':u.role==='approver'?'warn':u.role==='builder'?'blue':'')}</td><td>${esc(u.team)}</td></tr>`).join('');
  $('#view').innerHTML = `<h1>Admin</h1><div class="sub" style="margin-bottom:12px">What the organization owns. Files under <span class="mono">org/</span>; the platform team edits them, the console shows them.</div>
    <div class="card"><h2>Templates</h2><table><thead><tr><th>Template</th><th>Type</th><th>Team</th><th>Process</th><th>Default tools</th><th>Pauses</th><th>Params</th></tr></thead><tbody>${tpl}</tbody></table></div>
    <div class="card"><h2>Published tools</h2><table><thead><tr><th>Tool</th><th>Risk</th><th>Scope</th><th></th><th>Teams</th><th>Owner</th><th></th></tr></thead><tbody>${tools}</tbody></table>
      ${role()==='platform'?`<details style="margin-top:10px"><summary>Publish a tool</summary><div class="grid2" style="margin-top:8px"><div><label class="f">Name</label><input type="text" id="ptName"><label class="f">Implementation (module:attr)</label><input type="text" id="ptImpl" placeholder="factory.tools.knowledge:web_search"><label class="f">Description</label><input type="text" id="ptDesc"></div><div><label class="f">Risk</label><select id="ptRisk"><option>low</option><option>medium</option><option>high</option></select><label class="f">Scope</label><select id="ptScope"><option>any</option><option>user</option><option>service</option></select><label class="f">Teams (comma-separated, empty = all)</label><input type="text" id="ptTeams"><label class="f"><input type="checkbox" id="ptSens"> Sensitive (always pauses)</label><button class="primary" onclick="publishTool()">Publish</button><span id="ptOut"></span></div></div></details>`:''}</div>
    <div class="card"><h2>Processes</h2>${procs}</div>
    <div class="card"><h2>Users and roles</h2><table><thead><tr><th>Name</th><th>Id</th><th>Role</th><th>Team</th></tr></thead><tbody>${users}</tbody></table><div class="small">Roles are a demo stand-in for the Agent Server's auth block (SSO).</div></div>`;
}
async function publishTool(){
  const body = {name:$('#ptName').value.trim(), impl:$('#ptImpl').value.trim(), description:$('#ptDesc').value.trim(), risk:$('#ptRisk').value, scope:$('#ptScope').value, sensitive:$('#ptSens').checked, teams:$('#ptTeams').value.split(',').map(s=>s.trim()).filter(Boolean), owner: ME.team};
  try{ await api('/admin/tools', {method:'POST', body: JSON.stringify(body)}); toast('published '+body.name); viewAdmin(); }catch(e){ $('#ptOut').innerHTML = badge(e.message,'bad'); }
}
boot();
</script>
</body>
</html>
