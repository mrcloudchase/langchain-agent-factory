# The published tool catalog. Engineering publishes here; templates may only reference what is
# listed, and instances only what their team is allowed. `sensitive` tools always pause for a
# human. `scope: user` tools act as a person and cannot run from an unattended surface.
tools:
  - {name: knowledge_search,      description: "Search the internal knowledge base.",             impl: "factory.tools.knowledge:knowledge_search",      risk: low,    scope: any,     owner: platform}
  - {name: web_search,            description: "Public web search.",                              impl: "factory.tools.knowledge:web_search",            risk: low,    scope: any,     owner: platform}
  - {name: lookup_ticket,         description: "Read a helpdesk ticket.",                         impl: "factory.tools.helpdesk:lookup_ticket",          risk: low,    scope: any,     teams: [support], owner: support}
  - {name: lookup_customer,       description: "Read a customer profile (PII).",                  impl: "factory.tools.helpdesk:lookup_customer",        risk: medium, scope: any,     teams: [support], owner: support}
  - {name: lookup_order,          description: "Read an order and refund eligibility.",           impl: "factory.tools.helpdesk:lookup_order",           risk: low,    scope: any,     teams: [support], owner: support}
  - {name: draft_reply,           description: "Save a draft reply for a human to send.",         impl: "factory.tools.helpdesk:draft_reply",            risk: low,    scope: any,     teams: [support], owner: support}
  - {name: escalate_ticket,       description: "Escalate a ticket to tier 2.",                    impl: "factory.tools.helpdesk:escalate_ticket",        risk: medium, scope: any,     teams: [support], owner: support}
  - {name: issue_refund,          description: "Move money back to a customer.",                  impl: "factory.tools.helpdesk:issue_refund",           risk: high,   scope: any,     teams: [support], owner: support, sensitive: true}
  - {name: read_repo_file,        description: "Read a repository file.",                         impl: "factory.tools.repo:read_repo_file",             risk: low,    scope: any,     teams: [engineering, platform], owner: engineering}
  - {name: search_code,           description: "Regex search across the repository.",             impl: "factory.tools.repo:search_code",                risk: low,    scope: any,     teams: [engineering, platform], owner: engineering}
  - {name: read_ci_status,        description: "Read CI results and the PR diff.",                impl: "factory.tools.repo:read_ci_status",             risk: low,    scope: any,     teams: [engineering, platform], owner: engineering}
  - {name: post_pr_comment,       description: "Comment on a pull request as the engineer.",      impl: "factory.tools.repo:post_pr_comment",            risk: medium, scope: user,    teams: [engineering], owner: engineering, sensitive: true}
  - {name: send_slack_message,    description: "Post to Slack as the agent's bot identity.",      impl: "factory.tools.messaging:send_slack_message",    risk: medium, scope: service, teams: [research, platform], owner: platform}
  - {name: record_claim_decision, description: "Record a claim decision in the system of record.", impl: "factory.tools.claims:record_claim_decision",  risk: high,   scope: any,     teams: [operations], owner: operations, sensitive: true}
