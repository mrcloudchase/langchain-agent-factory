# Model tiers. Teams pick a tier, never a model id. Pinned params keep gates reproducible.
# In production this is the LLM Gateway's job (access policy, fallbacks, spend limits);
# the registry is the local stand-in.
default_tier: standard
tiers:
  - {name: economy,  description: "Cheap and fast: classification, drafting, summaries.", model: "deepseek:deepseek-chat", params: {temperature: 0}, fallback: "anthropic:claude-haiku-5-5", max_cost_tier: 1}
  - {name: standard, description: "Default for most agents.",                              model: "deepseek:deepseek-chat", params: {temperature: 0}, fallback: "anthropic:claude-sonnet-5-5", max_cost_tier: 2}
  - {name: premium,  description: "Hardest reasoning. Needs a budget approval.",            model: "deepseek:deepseek-chat", params: {temperature: 0}, fallback: "anthropic:claude-opus-5-5", teams: [engineering, research, platform], max_cost_tier: 3}
