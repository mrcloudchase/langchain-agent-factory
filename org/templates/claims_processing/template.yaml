key: claims_processing
title: Claims processing
archetype: workflow
summary: >-
  Takes a claim, checks the claims policy, decides approve, deny, or refer, and records the
  decision. Recording always pauses for a human; the process requires two approvals to reach production.
team_default: operations
allowed_teams: [operations]
process: regulated
model_tier: standard
parameters:
  - key: coverage_rules
    label: Coverage rules (plain language)
    type: text
    required: true
    default: >-
      Sudden and accidental events are covered: burst pipes, fire, theft with a police report,
      storm damage with a dated weather record. Gradual deterioration and wear are excluded.
      Deny only on an explicit exclusion; when unsure, refer.
  - key: auto_limit_usd
    label: Auto-approval limit (USD)
    type: number
    required: true
    default: 2500
  - key: documentation_rules
    label: Documentation rules
    type: text
    default: >-
      Every claim needs a dated incident description and evidence: invoice or estimate, photos,
      and for theft a police report. Missing documentation means refer, not deny.
tools:
  default: [knowledge_search, record_claim_decision]
  allowed: [knowledge_search, record_claim_decision, web_search]
oversight:
  required_approve: [record_claim_decision]
  allowed_decisions: [approve, edit, reject]
surfaces:
  default: [chat]
  allowed: [chat, sdk, webhook]
limits: {max_model_calls: 10, max_tool_calls: 10}
evals:
  thresholds:
    - {evaluator: tool_usage, min_score: 0.9}
    - {evaluator: oversight, min_score: 1.0}
    - {evaluator: policy_compliance, min_score: 1.0}
    - {evaluator: answer_contains, min_score: 0.8}
  regression_tolerance: 0.1
tags: [claims, operations]
