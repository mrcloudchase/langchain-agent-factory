steps:
  - key: clauses
    title: Extract clauses
    prompt: |
      Split this document into its distinct clauses, one per line, numbered. Keep the original wording.
      Document: {question}
  - key: check
    title: Check house rules
    tools: [knowledge_search]
    prompt: |
      Check each clause against the house rules on: {house_rules_topic}. Use knowledge_search to
      read the relevant rules. For each clause that conflicts, write: clause number, the rule, severity
      ({severity_scale}), and a suggested change. If nothing conflicts, say "no conflict" and name the rules checked.
      Clauses:
      {clauses}
  - key: report
    title: Report
    prompt: |
      Write the review for a non-lawyer: a one-line verdict, then the risks from the check in order of
      severity, then "This is a rules check, not legal advice."
      Check results:
      {check}
