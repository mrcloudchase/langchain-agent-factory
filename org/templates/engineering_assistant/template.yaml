key: engineering_assistant
title: Engineering assistant
archetype: agent
summary: "Lives in the IDE over MCP: explains code, diagnoses CI failures from the failing test and diff, posts review comments after approval."
team_default: engineering
allowed_teams: [engineering, platform]
process: standard
model_tier: premium
parameters:
  - key: review_conventions
    label: Review conventions
    type: text
    default: "Reference code as path:line. Never suggest skipping or deleting a test to get green."
tools:
  default: [read_repo_file, search_code, read_ci_status, knowledge_search, post_pr_comment]
  allowed: [read_repo_file, search_code, read_ci_status, knowledge_search, post_pr_comment]
oversight: {required_approve: [post_pr_comment], allowed_decisions: [approve, edit, reject]}
surfaces: {default: [mcp, chat], allowed: [mcp, chat, sdk]}
limits: {max_model_calls: 15, max_tool_calls: 25}
filesystem: read_only
evals:
  thresholds:
    - {evaluator: tool_usage, min_score: 0.9}
    - {evaluator: oversight, min_score: 1.0}
    - {evaluator: policy_compliance, min_score: 1.0}
    - {evaluator: answer_contains, min_score: 0.8}
  regression_tolerance: 0.1
tags: [engineering, ide]
