key: research_brief
title: Research brief
archetype: agent
summary: "Sourced answers to research questions, knowledge base first then the web, and a scheduled digest posted to Slack."
team_default: research
allowed_teams: [research, platform]
process: standard
model_tier: standard
parameters:
  - key: digest_sections
    label: Digest sections
    type: text
    default: "What changed; Why it matters; Recommended follow-ups"
  - key: digest_channel
    label: Slack channel for the digest
    type: text
    default: "#market-research"
tools:
  default: [knowledge_search, web_search, send_slack_message]
  allowed: [knowledge_search, web_search, send_slack_message]
subagents:
  - name: web-researcher
    description: Runs focused web searches on one sub-question and returns sourced bullets.
    system_prompt: You research exactly one question using web_search. Return 3-5 bullets, each with a source URL. Say clearly when evidence is thin.
    tools: [web_search]
    model_tier: economy
oversight: {required_approve: [], allowed_decisions: [approve, reject]}
surfaces: {default: [slack, cron], allowed: [slack, cron, chat, sdk]}
limits: {max_model_calls: 14, max_tool_calls: 18}
evals:
  thresholds:
    - {evaluator: tool_usage, min_score: 0.9}
    - {evaluator: answer_contains, min_score: 0.8}
    - {evaluator: policy_compliance, min_score: 1.0}
    - {evaluator: oversight, min_score: 1.0}
  regression_tolerance: 0.1
tags: [research, digest]
