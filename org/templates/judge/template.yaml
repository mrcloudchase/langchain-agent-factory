key: judge
title: Judge
archetype: agent
summary: "Grades an answer against a reference or rubric and returns a 0-1 score with reasons. Usable as an LLM judge in the eval gate."
team_default: platform
allowed_teams: [platform, research, engineering, support, operations, legal]
process: standard
model_tier: standard
parameters:
  - key: rubric
    label: Grading rubric
    type: text
    default: "1.0 conveys everything the reference requires with no errors; 0.0 wrong or missing; partial credit for partial coverage; never reward length or confidence."
tools: {default: [], allowed: []}
oversight: {required_approve: [], allowed_decisions: [approve, reject]}
surfaces: {default: [sdk], allowed: [sdk, chat]}
limits: {max_model_calls: 3, max_tool_calls: 2}
filesystem: none
evals:
  thresholds:
    - {evaluator: answer_contains, min_score: 0.8}
    - {evaluator: policy_compliance, min_score: 1.0}
    - {evaluator: oversight, min_score: 1.0}
    - {evaluator: tool_usage, min_score: 0.9}
  regression_tolerance: 0.1
tags: [evals, judge]
