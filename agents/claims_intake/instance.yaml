name: claims_intake
display_name: Claims Intake
template: claims_processing
team: operations
owner: ops-analyst@halcyon.example
purpose: Takes a claim, checks the claims policy, decides approve, deny, or refer,
  and records the decision. Recording always pauses for a human; the process requires
  two approvals to reach production.
parameters:
  coverage_rules: 'Sudden and accidental events are covered: burst pipes, fire, theft
    with a police report, storm damage with a dated weather record. Gradual deterioration
    and wear are excluded. Deny only on an explicit exclusion; when unsure, refer.'
  auto_limit_usd: 2500
  documentation_rules: 'Every claim needs a dated incident description and evidence:
    invoice or estimate, photos, and for theft a police report. Missing documentation
    means refer, not deny.'
created_by: ops-analyst@halcyon.example
created_at: '2026-10-28T23:03:01.674748+00:00'
