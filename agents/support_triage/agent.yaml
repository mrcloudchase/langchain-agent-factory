name: support_triage
display_name: Support Triage Assistant
team: support
owner: support-lead@halcyon.example
purpose: >-
  Triage incoming helpdesk tickets: gather context, apply the refund and escalation
  policies, draft a reply for a human agent, and request approval before any refund.
model_tier: standard
tools:
  - lookup_ticket
  - lookup_customer
  - lookup_order
  - knowledge_search
  - draft_reply
  - escalate_ticket
  - issue_refund
oversight:
  approve: [issue_refund]
  allowed_decisions: [approve, reject]
limits:
  max_model_calls: 10
  max_tool_calls: 12
  max_tool_calls_per_tool: 3
surfaces:
  - kind: webhook
    target: /webhooks/helpdesk
    input_template:
      question: "Triage ticket {ticket_id}"
  - kind: chat
filesystem: none
evals:
  dataset: evals/dataset.jsonl
  thresholds:
    - {evaluator: tool_usage, min_score: 0.9}
    - {evaluator: oversight, min_score: 1.0}
    - {evaluator: policy_compliance, min_score: 1.0}
    - {evaluator: answer_contains, min_score: 0.8}
  regression_tolerance: 0.1
tags: [support, helpdesk]
