name: engineering_assistant
display_name: Engineering Assistant
team: engineering
owner: eng-lead@halcyon.example
purpose: >-
  Help engineers from inside their editor: explain code in the repository, diagnose CI
  failures from the failing test and log, and post review comments after approval.
model_tier: premium
tools: [read_repo_file, search_code, read_ci_status, knowledge_search, post_pr_comment]
oversight:
  approve: [post_pr_comment]
  allowed_decisions: [approve, edit, reject]
limits:
  max_model_calls: 15
  max_tool_calls: 25
surfaces:
  - kind: mcp
    target: engineering_assistant
  - kind: chat
filesystem: read_only
evals:
  dataset: evals/dataset.jsonl
  thresholds:
    - {evaluator: tool_usage, min_score: 0.9}
    - {evaluator: oversight, min_score: 1.0}
    - {evaluator: policy_compliance, min_score: 1.0}
    - {evaluator: answer_contains, min_score: 0.8}
  regression_tolerance: 0.1
tags: [engineering, ide]
