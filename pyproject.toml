[project]
name = "agent-factory"
version = "0.1.0"
description = "An organization-wide agent factory built on LangChain, LangGraph, Deep Agents, and LangSmith."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.7.30",
    "langchain>=1.4",
    "langgraph>=1.2",
    "langsmith>=0.14",
    "langgraph-sdk>=0.3",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.0",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "langgraph-cli[inmem]>=0.4",
]
slack = ["slack-bolt>=1.21"]

[project.scripts]
factory = "agent_factory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/agent_factory/catalog.py" = ["E501"]  # HTML template strings
"src/agent_factory/cli.py" = ["E501"]      # Rich console strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
