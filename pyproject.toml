[project]
name = "agent-factory"
version = "3.0.0"
description = "An organization's agent platform on LangChain: templates, a tool catalog, and a path to production that teams use to build their own agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.7.30",
    "langchain>=1.4",
    "langgraph>=1.2",
    "langgraph-sdk>=0.3",
    "langsmith>=0.14",
    "langchain-deepseek>=1.1",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "httpx>=0.27",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.0",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "langgraph-cli[inmem]>=0.4"]

[project.scripts]
factory = "factory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/factory/server/api.py" = ["B008"]  # FastAPI Depends in signatures

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
