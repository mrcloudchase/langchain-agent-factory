[project]
name = "agent-factory"
version = "2.0.0"
description = "The operating-model layer for running many agents on LangChain: org-defined templates, a published tool catalog, policy, eval gates, a promotion process, and a console where teams create agents from templates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.7.30",
    "langchain>=1.4",
    "langgraph>=1.2",
    "langsmith>=0.14",
    "langgraph-sdk>=0.3",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "langchain-deepseek>=1.1",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.0",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "httpx>=0.27", "langgraph-cli[inmem]>=0.4"]
slack = ["slack-bolt>=1.21"]

[project.scripts]
factory = "factory.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/factory/console/api/*.py" = ["E501", "B008"]  # FastAPI Depends
"src/factory/cli/*.py" = ["E501"]
"src/factory/surfaces/__init__.py" = ["E501"]  # user-facing wiring text

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
