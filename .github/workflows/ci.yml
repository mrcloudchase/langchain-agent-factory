name: factory-ci
on:
  pull_request:
  push:
    branches: [main, v2]
jobs:
  check:
    name: org check, lint, tests (offline, no secrets)
    runs-on: ubuntu-latest
    env:
      FACTORY_OFFLINE: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Org is consistent (templates, tool catalog, processes, teams)
        run: uv run factory check
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run pytest -q
