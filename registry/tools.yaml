# The approved tool catalog. A spec may only reference tools listed here, and only
# if its team is allowed. `sensitive` tools pause for human approval. `scope: user`
# tools act on behalf of a person and cannot run from an unattended surface.
tools:
  - name: knowledge_search
    description: Search the internal knowledge base (policies, runbooks, product notes).
    impl: agent_factory.tools.knowledge:knowledge_search
    risk: low
    scope: any
    owner: platform
  - name: web_search
    description: Public web search.
    impl: agent_factory.tools.knowledge:web_search
    risk: low
    scope: any
    owner: platform

  - name: lookup_ticket
    description: Read a helpdesk ticket.
    impl: agent_factory.tools.helpdesk:lookup_ticket
    risk: low
    scope: any
    teams: [support]
    owner: support
  - name: lookup_customer
    description: Read a customer profile (PII).
    impl: agent_factory.tools.helpdesk:lookup_customer
    risk: medium
    scope: any
    teams: [support]
    owner: support
  - name: lookup_order
    description: Read an order and its refund eligibility.
    impl: agent_factory.tools.helpdesk:lookup_order
    risk: low
    scope: any
    teams: [support]
    owner: support
  - name: draft_reply
    description: Save a draft reply for a human to send.
    impl: agent_factory.tools.helpdesk:draft_reply
    risk: low
    scope: any
    teams: [support]
    owner: support
  - name: escalate_ticket
    description: Escalate a ticket to tier 2.
    impl: agent_factory.tools.helpdesk:escalate_ticket
    risk: medium
    scope: any
    teams: [support]
    owner: support
  - name: issue_refund
    description: Move money back to a customer.
    impl: agent_factory.tools.helpdesk:issue_refund
    risk: high
    sensitive: true
    scope: any
    teams: [support]
    owner: support

  - name: read_repo_file
    description: Read a file from the repository.
    impl: agent_factory.tools.repo:read_repo_file
    risk: low
    scope: any
    teams: [engineering, platform]
    owner: engineering
  - name: search_code
    description: Regex search across the repository.
    impl: agent_factory.tools.repo:search_code
    risk: low
    scope: any
    teams: [engineering, platform]
    owner: engineering
  - name: read_ci_status
    description: Read CI results for a pull request.
    impl: agent_factory.tools.repo:read_ci_status
    risk: low
    scope: any
    teams: [engineering, platform]
    owner: engineering
  - name: post_pr_comment
    description: Comment on a pull request as the engineer.
    impl: agent_factory.tools.repo:post_pr_comment
    risk: medium
    sensitive: true
    scope: user
    teams: [engineering]
    owner: engineering
  - name: open_pull_request
    description: Open a pull request as the engineer.
    impl: agent_factory.tools.repo:open_pull_request
    risk: high
    sensitive: true
    scope: user
    teams: [engineering]
    owner: engineering

  - name: send_slack_message
    description: Post to Slack as the agent's bot identity.
    impl: agent_factory.tools.messaging:send_slack_message
    risk: medium
    scope: service
    teams: [research, platform]
    owner: platform
